services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CARTO_API_KEY: "${CARTO_API_KEY:-}"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
